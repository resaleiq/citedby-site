<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" width="800" height="610" role="img" aria-labelledby="t d"><title id="t">Share of 10,426 popular EU sites whose robots.txt blocks each crawler</title><desc id="d">Bar chart, robots.txt read on 23 October 2026. GPTBot 15.3% (1,596 sites); Google-Extended 11.3% (1,173 sites); PerplexityBot 7.3% (763 sites); OAI-SearchBot 5.6% (584 sites); Bingbot 1.7% (176 sites); Googlebot 1.0% (108 sites). Blue bars are the five crawlers the check looks at; Googlebot is a control.</desc><rect width="800" height="610" fill="#fff"/><text x="32" y="46" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="600" fill="#0F1B2D">Share of 10,426 popular EU sites</text><text x="32" y="80" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="600" fill="#0F1B2D">whose robots.txt blocks each crawler</text><text x="32" y="112" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#556070">Read on 23 Oct 2026. Blocked: may not fetch the home page.</text><line x1="236.0" y1="138" x2="236.0" y2="508" stroke="#C9D0DA" stroke-width="1"/><text x="236.0" y="530" font-family="system-ui,Arial,sans-serif" font-size="17" fill="#556070" text-anchor="middle">0%</text><line x1="356.0" y1="138" x2="356.0" y2="508" stroke="#C9D0DA" stroke-width="1"/><text x="356.0" y="530" font-family="system-ui,Arial,sans-serif" font-size="17" fill="#556070" text-anchor="middle">5%</text><line x1="476.0" y1="138" x2="476.0" y2="508" stroke="#C9D0DA" stroke-width="1"/><text x="476.0" y="530" font-family="system-ui,Arial,sans-serif" font-size="17" fill="#556070" text-anchor="middle">10%</text><line x1="596.0" y1="138" x2="596.0" y2="508" stroke="#C9D0DA" stroke-width="1"/><text x="596.0" y="530" font-family="system-ui,Arial,sans-serif" font-size="17" fill="#556070" text-anchor="middle">15%</text><line x1="716.0" y1="138" x2="716.0" y2="508" stroke="#C9D0DA" stroke-width="1"/><text x="716.0" y="530" font-family="system-ui