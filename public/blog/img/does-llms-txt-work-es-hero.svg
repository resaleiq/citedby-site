<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">¿Sirve llms.txt para aparecer en ChatGPT? Dos estudios y la documentación de Google</title><desc id="d">Tarjeta con el título ¿sirve llms.txt? y dos cifras: el 97 % de los archivos no recibió ninguna petición y unos 300.000 dominios no mostraron un vínculo claro con las citas de IA</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="118" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">¿Sirve llms.txt para</text><text x="72" y="182" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">aparecer en ChatGPT? Dos</text><text x="72" y="246" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">estudios y la</text><text x="72" y="324" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">Dos estudios y la guía de Google</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="386" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="434" font-size="24" font-weight="600">97 % sin peticiones</text><text x="94" y="526" font-size="19" fill="#556070">Ahrefs en mayo de 2026</text><rect x="435" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="386" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="457" y="434" font-size="24" font-weight="600">300.000 dominios</text><text x="457" y="526" font-size="19" fill="#556070">SE Ranking sin vínculo claro</text><rect x="798" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="386" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="820" y="434" font-s