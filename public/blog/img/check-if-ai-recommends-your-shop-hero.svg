<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">How to check whether AI assistants recommend your shop</title><desc id="d">Five steps to check whether AI assistants name your shop: write questions, ask each assistant, ask twice, note name and link, add it up</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="118" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">How to check whether AI</text><text x="72" y="182" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">assistants recommend</text><text x="72" y="246" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">your shop</text><text x="72" y="324" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">A 10-minute check you can run today</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="386" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="434" font-size="24" font-weight="600">Write 5 buyer</text><text x="94" y="464" font-size="24" font-weight="600">questions</text><text x="94" y="526" font-size="19" fill="#556070">No shop name in them</text><rect x="344" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="366" y="386" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="366" y="434" font-size="24" font-weight="600">Ask each</text><text x="366" y="464" font-size="24" font-weight="600">assistant</text><text x="366" y="526" font-size="19" fill="#556070">Logged out, web</text><text x="366" y="550" font-size="19" fill="#556070">search on</text><rect x="616" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="638" y="386" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="638" y="434" font-size="24" font-weight="600">Ask twice</text><text x="638" y="526" font-size="19" fill="#556070">Answers change</text><text x="638" y="550" font-size="19" fill="#556070">between runs</text><rect x="888" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="910" y="386" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="910" y="434" font-size="24" font-weight="600">Count the</text><text x="910" y="464" font-size="24" font-weight="600">mentions</text><text x="910" y="526" font-size="19" fill="#556070">Named in text, domain</text><text x="910" y="550" font-size="19" fill="#556070">linked</text></g></svg>