<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">¿Está bloqueado GPTBot en mi web? Cuatro sitios donde mirar y una prueba para cada uno</title><desc id="d">Revisa el archivo de robots / Lanza una auditoría / Compara dos peticiones / Mira tu CDN y tu cortafuegos / Busca en los registros</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="110" font-family="Georgia,serif" font-size="46" font-weight="600" fill="#0F1B2D">¿Está bloqueado GPTBot en mi web? Cuatro sitios</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="200" width="184" height="330" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="246" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="294" font-size="24" font-weight="600">Revisa el</text><text x="94" y="324" font-size="24" font-weight="600">archivo de</text><text x="94" y="354" font-size="24" font-weight="600">robots</text><rect x="289" y="200" width="184" height="330" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="311" y="246" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="311" y="294" font-size="24" font-weight="600">Lanza una</text><text x="311" y="324" font-size="24" font-weight="600">auditoría</text><rect x="506" y="200" width="184" height="330" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="528" y="246" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="528" y="294" font-size="24" font-weight="600">Compara dos</text><text x="528" y="324" font-size="24" font-weight="600">peticiones</text><rect x="723" y="200" width="184" height="330" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="745" y="246" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="745" y="294" font-size="24" font-weight="600">Mira tu CDN</text><text x="745" y="324" font-size="24" font-weight="600">y tu</