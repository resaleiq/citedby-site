<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Was sagt ChatGPT über Ihre Marke? 20 Prompts zum Selbsttest</title><desc id="d">Titelkarte: Was sagt ChatGPT über Ihre Marke, mit vier Gruppen von Prompts: Marke, Kategorie, Vergleich und Fakten</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="118" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">Was sagt ChatGPT über</text><text x="72" y="182" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">Ihre Marke? 20 Prompts</text><text x="72" y="246" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">zum Selbsttest</text><text x="72" y="324" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">20 Fragen, je zweimal gestellt, in einer Tabelle</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="386" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="434" font-size="24" font-weight="600">Marke</text><text x="94" y="526" font-size="19" fill="#556070">kennt der Assistent</text><text x="94" y="550" font-size="19" fill="#556070">Sie?</text><rect x="344" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="366" y="386" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="366" y="434" font-size="24" font-weight="600">Kategorie</text><text x="366" y="526" font-size="19" fill="#556070">werden Sie genannt?</text><rect x="616" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="638" y="386" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="638" y="434" font-size="24" font-weight="600">Vergleich</text><text x="638" y="526" font-size="19" fill="#556070">wer schlägt Sie?</text><rect x="888" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="910" y="386" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="910" y="434" font-size="24" font-weight="600">Fakten</text><text x="910" y="526" font-size="19" fill="#556070">stimmen die Angaben?</text></g></svg>