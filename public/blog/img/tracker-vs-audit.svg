<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
<title id="t">Two different jobs</title><desc id="d">A tracker watches what AI assistants answer to a set of prompts. A site audit checks whether AI crawlers can read your pages and gives the fix.</desc>
<rect width="1200" height="360" fill="#fff"/><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><text x="48" y="52" font-size="28" font-weight="600">Two different questions</text>
<rect x="48" y="88" width="520" height="210" fill="#EEF2F7" stroke="#0F1B2D" stroke-width="3"/><text x="72" y="134" font-size="24" font-weight="600">An AI answer tracker</text><text x="72" y="176" font-size="19" fill="#556070">Do AI answers mention my brand?</text><text x="72" y="208" font-size="19" fill="#556070">Which sources do they cite?</text><text x="72" y="240" font-size="19" fill="#556070">How does that change over time?</text><text x="72" y="276" font-size="17" font-weight="600" fill="#1F4FD8">Profound, Peec AI, OtterlyAI</text>
<rect x="632" y="88" width="520" height="210" fill="#EEF2F7" stroke="#0F1B2D" stroke-width="3"/><text x="656" y="134" font-size="24" font-weight="600">A site audit</text><text x="656" y="176" font-size="19" fill="#556070">Can AI crawlers read my pages?</text><text x="656" y="208" font-size="19" fill="#556070">What blocks them, and what is the fix?</text><text x="656" y="240" font-size="19" fill="#556070">Does not track brand mentions.</text><text x="656" y="276" font-size="17" font-weight="600" fill="#1F4FD8">CitedBy</text>
<text x="48" y="338" font-size="15" fill="#556070">OtterlyAI's pricing page also lists a crawlability audit among its plan features.</text></g></svg>
