<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">The fix loop for a stale price</title><desc id="d">Five steps in a row: record the wrong answer, find the source, fix the source, wait for the crawlers, ask again twice in a new chat.</desc>
<rect width="1200" height="520" fill="#fff"/>
<g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D">
<text x="60" y="64" font-size="28" font-weight="600">The fix loop for a stale price</text>
<g stroke="#0F1B2D" stroke-width="3" fill="#EEF2F7"><rect x="60" y="120" width="200" height="260"/><rect x="290" y="120" width="200" height="260"/><rect x="520" y="120" width="200" height="260"/><rect x="750" y="120" width="200" height="260"/><rect x="980" y="120" width="160" height="260"/></g>
<g font-size="36" font-weight="600" fill="#1F4FD8"><text x="80" y="176">1</text><text x="310" y="176">2</text><text x="540" y="176">3</text><text x="770" y="176">4</text><text x="1000" y="176">5</text></g>
<g font-size="22" font-weight="600"><text x="80" y="224">Record</text><text x="310" y="224">Trace</text><text x="540" y="224">Fix</text><text x="770" y="224">Wait</text><text x="1000" y="224">Re-ask</text></g>
<g font-size="17" fill="#556070"><text x="80" y="262">Prompt, date, the</text><text x="80" y="286">price and any link</text>
<text x="310" y="262">Search the old price</text><text x="310" y="286">on page, feed, web</text>
<text x="540" y="262">Change it at the</text><text x="540" y="286">source, not the chat</text>
<text x="770" y="262">Crawlers return on</text><text x="770" y="286">their own schedule</text>
<text x="1000" y="262">Twice, new chat</text></g>
</g>
<text x="60" y="450" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#556070">Nobody can promise a date. Re-ask weekly and log each answer.</text>
</svg>
