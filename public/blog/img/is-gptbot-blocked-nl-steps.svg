<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Is GPTBot geblokkeerd op mijn site? Vier plekken om na te kijken, met een test per plek</title><desc id="d">Open uwwebshop.nl/robots.txt in een browser / Draai de gratis check in het vak hierboven / Stuur twee verzoeken naar uw homepage en vergelijk de / Open uw CDN-account en kijk bij de instellingen voor / Doorzoek de regels van uw beveiligingsplugin of firewall op</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="96" font-family="Georgia,serif" font-size="42" font-weight="600" fill="#0F1B2D">Is GPTBot geblokkeerd op mijn site? Vier</text><text x="72" y="148" font-family="Georgia,serif" font-size="42" font-weight="600" fill="#0F1B2D">plekken om na te kijken, met een test per</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="231" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="279" font-size="24" font-weight="600">Open</text><text x="94" y="309" font-size="24" font-weight="600">uwwebshop.nl/robots.txt</text><text x="94" y="339" font-size="24" font-weight="600">in een browser</text><rect x="435" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="231" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="457" y="279" font-size="24" font-weight="600">Draai de gratis check</text><text x="457" y="309" font-size="24" font-weight="600">in het vak hierboven</text><rect x="798" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="231" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="820" y="279" font-size="24" font-weight="600">Stuur twee verzoeken</text><text x="820" y="309" font-size="24" font-weight="600">naar uw homepage en</text><text x="820" y="339" font-size="24" font-weight="600">vergelijk de</text><rect x="72" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="426" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="94" y="474" font-size="24" font-weight="600">Open uw CDN-account en</text><text x="94" y="504" font-size="24" font-weight="600">kijk bij de</text><text x="94" y="534" font-size="24" font-weight="600">instellingen voor</text><rect x="435" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="426" font-size="40" font-weight="600" fill="#1F4FD8">5</text><text x="457" y="474" font-size="24" font-weight="600">Doorzoek de regels van</text><text x="457" y="504" font-size="24" font-weight="600">uw beveiligingsplugin</text><text x="457" y="534" font-size="24" font-weight="600">of firewall op</text></g></svg>