<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
<title id="t">ChatGPT shows my old price</title><desc id="d">A price tag showing an old price that is crossed out and a new price, with the three places a stale price can come from: your page, your product feed, other sites.</desc>
<rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/>
<text x="72" y="130" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="600" fill="#0F1B2D">ChatGPT shows</text><text x="72" y="204" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="600" fill="#0F1B2D">my old price</text>
<text x="72" y="262" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">Find the stale source, fix it, then re-ask</text>
<g font-family="system-ui,Arial,sans-serif" font-size="24" fill="#0F1B2D">
<rect x="72" y="320" width="330" height="200" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="366" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="414" font-weight="600">Your own page</text><text x="94" y="446" font-size="19" fill="#556070">Price text, schema, cache</text>
<rect x="435" y="320" width="330" height="200" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="366" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="457" y="414" font-weight="600">Your product feed</text><text x="457" y="446" font-size="19" fill="#556070">Merchant Center, marketplaces</text>
<rect x="798" y="320" width="330" height="200" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="366" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="820" y="414" font-weight="600">Other websites</text><text x="820" y="446" font-size="19" fill="#556070">Reviews, lists, old posts</text></g>
<text x="72" y="590" font-family="system-ui,Arial,sans-serif" font-size="22" fill="#0F1B2D" font-weight="600">CitedBy · citedby.eu</text></svg>
