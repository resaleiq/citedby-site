<title id="t">Monthly plan prices listed by Peec AI and OtterlyAI</title><desc id="d">Peec AI: Starter 85, Pro 205, Advanced 425 euros a month. OtterlyAI: Lite 29, Standard 189, Premium 489 euros a month. Profound lists no monthly price.</desc>
<rect width="1200" height="480" fill="#fff"/><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><text x="48" y="52" font-size="28" font-weight="600">Monthly plan prices as listed, in euros</text>
<text x="48" y="128" font-size="19" font-weight="600">Peec AI Starter</text><rect x="250" y="104" width="136" height="34" fill="#1F4FD8"/><text x="398" y="129" font-size="19" font-weight="600">€85</text><text x="48" y="180" font-size="19" font-weight="600">Peec AI Pro</text><rect x="250" y="156" width="328" height="34" fill="#1F4FD8"/><text x="590" y="181" font-size="19" font-weight="600">€205</text><text x="48" y="232" font-size="19" font-weight="600">Peec AI Advanced</text><rect x="250" y="208" width="680" height="34" fill="#1F4FD8"/><text x="942" y="233" font-size="19" font-weight="600">€425</text><text x="48" y="284" font-size="19" font-weight="600">OtterlyAI Lite</text><rect x="250" y="260" width="46" height="34" fill="#0F1B2D"/><text x="308" y="285" font-size="19" font-weight="600">€29</text><text x="48" y="336" font-size="19" font-weight="600">OtterlyAI Standard</text><rect x="250" y="312" width="302" height="34" fill="#0F1B2D"/><text x="564" y="337" font-size="19" font-weight="600">€189</text><text x="48" y="388" font-size="19" font-weight="600">OtterlyAI Premium</text><rect x="250" y="364" width="782" height="34" fill="#0F1B2D"/><text x="1044" y="389" font-size="19" font-weight="600">€489</text>
<text x="48" y="438" font-size="16" fill="#556070">Profound lists no monthly price (free trial, Enterprise custom). Monthly billing; plans differ in prompts, engines and projects.</text>
<text x="48" y="462" font-size="15" fill="#556070">Source: each vendor's pricing page, fetched 19 Oct 2026. Euros as shown to a browser in Spain.</text></g></svg>