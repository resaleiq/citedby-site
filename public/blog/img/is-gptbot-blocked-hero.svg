<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
<title id="t">Is GPTBot blocked on my site?</title><desc id="d">Four places a crawler can be stopped: robots.txt, your CDN, a security plugin or firewall rule, and your server.</desc>
<rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/>
<text x="72" y="130" font-family="Georgia,&apos;Times New Roman&apos;,serif" font-size="64" font-weight="600" fill="#0F1B2D">Is GPTBot blocked</text><text x="72" y="204" font-family="Georgia,&apos;Times New Roman&apos;,serif" font-size="64" font-weight="600" fill="#0F1B2D">on my site?</text>
<text x="72" y="262" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">Four places to look, with the test for each</text>
<g font-family="system-ui,Arial,sans-serif" font-size="24" fill="#0F1B2D">
<rect x="72" y="320" width="246" height="200" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="366" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="414" font-weight="600">robots.txt</text><text x="94" y="446" font-size="19" fill="#556070">Disallow rules</text>
<rect x="354" y="320" width="246" height="200" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="376" y="366" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="376" y="414" font-weight="600">CDN</text><text x="376" y="446" font-size="19" fill="#556070">Cloudflare AI settings</text>
<rect x="636" y="320" width="246" height="200" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="658" y="366" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="658" y="414" font-weight="600">Firewall</text><text x="658" y="446" font-size="19" fill="#556070">Plugin or WAF rule</text>
<rect x="918" y="320" width="210" height="200" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="940" y="366" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="940" y="414" font-weight="600">Server</text><text x="940" y="446" font-size="19" fill="#556070">User-agent rules</text></g>
