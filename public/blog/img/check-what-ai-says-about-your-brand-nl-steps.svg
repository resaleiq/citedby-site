<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Wat zegt ChatGPT over uw webshop? 20 prompts om het zelf te checken</title><desc id="d">Voer de prompt uit en bewaar de volledige antwoordtekst / Markeer &quot;genoemd&quot; als uw merknaam of domein in de / Markeer &quot;gelinkt&quot; als een link naar uw eigen domein / Controleer bij groep A en D elk feit aan / Stel dezelfde prompt nog eens in een nieuwe chat</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="96" font-family="Georgia,serif" font-size="42" font-weight="600" fill="#0F1B2D">Wat zegt ChatGPT over uw webshop? 20</text><text x="72" y="148" font-family="Georgia,serif" font-size="42" font-weight="600" fill="#0F1B2D">prompts om het zelf te checken</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="231" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="279" font-size="24" font-weight="600">Voer de prompt uit en</text><text x="94" y="309" font-size="24" font-weight="600">bewaar de volledige</text><text x="94" y="339" font-size="24" font-weight="600">antwoordtekst</text><rect x="435" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="231" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="457" y="279" font-size="24" font-weight="600">Markeer &quot;genoemd&quot; als</text><text x="457" y="309" font-size="24" font-weight="600">uw merknaam of domein</text><text x="457" y="339" font-size="24" font-weight="600">in de</text><rect x="798" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="231" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="820" y="279" font-size="24" font-weight="600">Markeer &quot;gelinkt&quot; als</text><text x="820" y="309" font-size="24" font-weight="600">een link naar uw eigen</text><text x="820" y="339" font-size="24" font-weight="600">domein</text><rect x="72" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="426" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="94" y="474" font-size="24" font-weight="600">Controleer bij groep A</text><text x="94" y="504" font-size="24" font-weight="600">en D elk feit aan</text><rect x="435" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="426" font-size="40" font-weight="600" fill="#1F4FD8">5</text><text x="457" y="474" font-size="24" font-weight="600">Stel dezelfde prompt</text><text x="457" y="504" font-size="24" font-weight="600">nog eens in een nieuwe</text><text x="457" y="534" font-size="24" font-weight="600">chat</text></g></svg>