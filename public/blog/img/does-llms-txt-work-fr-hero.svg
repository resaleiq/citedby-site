<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Le fichier llms.txt sert-il à quelque chose ? Ce que disent deux études et Google</title><desc id="d">Carte de titre sur llms.txt avec deux chiffres : 97 % des fichiers n&#x27;ont reçu aucune requête, et environ 300 000 domaines sans lien net avec les citations IA</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="118" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">Le fichier llms.txt</text><text x="72" y="182" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">sert-il à quelque chose</text><text x="72" y="246" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">? Ce que disent deux</text><text x="72" y="324" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">97 % des fichiers sans aucune requête</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="386" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="434" font-size="24" font-weight="600">97 %</text><text x="94" y="526" font-size="19" fill="#556070">fichiers sans requête</text><rect x="435" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="386" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="457" y="434" font-size="24" font-weight="600">300 000</text><text x="457" y="526" font-size="19" fill="#556070">domaines (SE Ranking)</text><rect x="798" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="386" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="820" y="434" font-size="24" font-weight="600">Google</text><text x="820" y="526" font-size="19" fill="#556070">aucun fichier IA requis</text></g></svg>