<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">ChatGPT toont mijn oude prijs. Zo vindt u waar het die las en herstelt u het</title><desc id="d">Titelkaart: ChatGPT toont mijn oude prijs, met drie vakken: uw eigen pagina, uw productfeed, andere websites</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="118" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">ChatGPT toont mijn oude</text><text x="72" y="182" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">prijs. Zo vindt u waar</text><text x="72" y="246" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">het die las en herstelt</text><text x="72" y="324" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">Herstel de bron, niet de chat</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="386" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="434" font-size="24" font-weight="600">Uw eigen pagina</text><text x="94" y="526" font-size="19" fill="#556070">tekst en JSON-LD</text><rect x="435" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="386" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="457" y="434" font-size="24" font-weight="600">Uw productfeed</text><text x="457" y="526" font-size="19" fill="#556070">prijs en actieprijs</text><rect x="798" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="386" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="820" y="434" font-size="24" font-weight="600">Andere websites</text><text x="820" y="526" font-size="19" fill