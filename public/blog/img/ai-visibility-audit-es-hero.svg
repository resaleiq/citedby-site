<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Auditoría de visibilidad en IA: qué revisa y qué recibes</title><desc id="d">Tarjeta con el título auditoría de visibilidad en IA y tres cuadros: acceso de rastreadores, HTML legible y datos estructurados</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="118" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">Auditoría de visibilidad</text><text x="72" y="182" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">en IA: qué revisa y qué</text><text x="72" y="246" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">recibes</text><text x="72" y="324" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">Qué revisamos página por página</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="386" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="434" font-size="24" font-weight="600">Acceso de</text><text x="94" y="464" font-size="24" font-weight="600">rastreadores</text><text x="94" y="526" font-size="19" fill="#556070">robots.txt y firewall</text><rect x="344" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="366" y="386" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="366" y="434" font-size="24" font-weight="600">HTML legible</text><text x="366" y="526" font-size="19" fill="#556070">Texto sin JavaScript</text><rect x="616" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="638" y="386" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="638" y="434" font-size="24" font-weight="600">Datos</text><text x="638" y="464" font-size="24" font-weight="600">estructurados</text><text x="638" y="526" font-size="19" fill="#556070">JSON-LD de producto</text><rect x="888" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="910" y="386" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="910" y="434" font-size="24" font-weight="600">Calidad de</text><text x="910" y="464" font-size="24" font-weight="600">respuesta</text><text x="910" y="526" font-size="19" fill="#556070">Precio, envío y FAQ</text></g></svg>