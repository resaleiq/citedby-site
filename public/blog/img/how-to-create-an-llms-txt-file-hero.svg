<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">How to create an llms.txt file, step by step</title><desc id="d">Title card: how to create an llms.txt file, with four parts of the file: title, summary, link sections, optional section</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="118" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">How to create an</text><text x="72" y="182" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">llms.txt file, step by</text><text x="72" y="246" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">step</text><text x="72" y="324" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">A # title, a &gt; summary, ## link lists, then a free check</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="386" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="434" font-size="24" font-weight="600"># Title</text><text x="94" y="526" font-size="19" fill="#556070">the only required</text><text x="94" y="550" font-size="19" fill="#556070">line</text><rect x="344" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="366" y="386" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="366" y="434" font-size="24" font-weight="600">&gt; Summary</text><text x="366" y="526" font-size="19" fill="#556070">what the site is</text><rect x="616" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="638" y="386" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="638" y="434" font-size="24" font-weight="600">## Sections</text><text x="638" y="526" font-size="19" fill="#556070">lists of links</text><rect x="888" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="910" y="386" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="910" y="434" font-size="24" font-weight="600">## Optional</text><text x="910" y="526" font-size="19" fill="#556070">links to skip</text></g></svg>