<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
<title id="t">GEO audit vs AEO audit vs SEO audit</title><desc id="d">Three boxes: an SEO audit asks whether you rank, an AEO audit asks whether you are the answer, a GEO audit asks whether AI names you.</desc>
<rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/>
<text x="72" y="130" font-family="Georgia,'Times New Roman',serif" font-size="60" font-weight="600" fill="#0F1B2D">GEO vs AEO vs SEO audit</text>
<text x="72" y="190" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">Three names, three questions, one shared base</text>
<g font-family="system-ui,Arial,sans-serif" font-size="24" fill="#0F1B2D">
<rect x="72" y="260" width="330" height="250" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="312" font-size="36" font-weight="600" fill="#1F4FD8">SEO</text><text x="94" y="364" font-weight="600">Do I rank?</text><text x="94" y="398" font-size="19" fill="#556070">Links in a results page</text>
<rect x="435" y="260" width="330" height="250" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="312" font-size="36" font-weight="600" fill="#1F4FD8">AEO</text><text x="457" y="364" font-weight="600">Am I the answer?</text><text x="457" y="398" font-size="19" fill="#556070">Quotable, direct answers</text>
<rect x="798" y="260" width="330" height="250" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="312" font-size="36" font-weight="600" fill="#1F4FD8">GEO</text><text x="820" y="364" font-weight="600">Does AI name me?</text><text x="820" y="398" font-size="19" fill="#556070">Mentions in generated text</text></g>
<text x="72" y="590" font-family="system-ui,Arial,sans-serif" font-size="22" fill="#0F1B2D" font-weight="600">CitedBy · citedby.eu</text></svg>
