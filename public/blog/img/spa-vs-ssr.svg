<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Client-side rendering vs server-side rendering</title><desc id="d">Two paths. Client-side: the server sends an empty shell and JavaScript fills it in, so a crawler without JavaScript reads nothing. Server-side or prerendered: the server sends the finished HTML, so every crawler reads the content.</desc>
<rect width="1200" height="560" fill="#fff"/>
<g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D">
<text x="60" y="60" font-size="28" font-weight="600">What the crawler receives</text>
<g stroke="#0F1B2D" stroke-width="3" fill="#EEF2F7"><rect x="60" y="100" width="520" height="370"/><rect x="620" y="100" width="520" height="370"/></g>
<text x="84" y="148" font-size="24" font-weight="600" fill="#B3121F">Client-side rendering</text><text x="644" y="148" font-size="24" font-weight="600" fill="#1F4FD8">Server-side or prerendered</text>
<g font-size="20"><text x="84" y="200">1. Server sends a shell:</text><text x="84" y="236" font-family="ui-monospace,Menlo,monospace" font-size="19">&lt;div id="root"&gt;&lt;/div&gt;</text><text x="84" y="284">2. A script builds the page</text><text x="84" y="320">    in the browser.</text><text x="84" y="376" font-weight="600">Crawler that skips scripts:</text><text x="84" y="408" fill="#B3121F" font-weight="600">reads nothing.</text>
<text x="644" y="200">1. Server sends the finished page:</text><text x="644" y="236" font-family="ui-monospace,Menlo,monospace" font-size="19">&lt;h1&gt;Product&lt;/h1&gt;&lt;p&gt;€49 ...</text><text x="644" y="284">2. A script adds interactivity</text><text x="644" y="320">    afterwards.</text><text x="644" y="376" font-weight="600">Every crawler:</text><text x="644" y="408" fill="#1F4FD8" font-weight="600">reads the content.</text></g></g>
<text x="60" y="520" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#556070">Sources: Vercel, "The rise of the AI crawler"; Next.js and Lovable documentation.</text>
</svg>
