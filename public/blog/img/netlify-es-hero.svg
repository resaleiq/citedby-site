<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Netlify: robots.txt y User Agent Blocker contra bots de IA</title><desc id="d">Cuatro datos sobre Netlify: Dónde robots.txt en la raíz del sitio, Bloqueo en el edge User Agent Blocker, Activación Un proyecto a la vez, Respaldo Edge Function</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="118" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">Netlify: robots.txt y</text><text x="72" y="182" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">User Agent Blocker</text><text x="72" y="246" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">contra bots de IA</text><text x="72" y="324" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">Ajustes de rastreadores de IA en Netlify</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="386" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="434" font-size="24" font-weight="600">Dónde</text><text x="94" y="526" font-size="19" fill="#556070">robots.txt en la raíz</text><text x="94" y="550" font-size="19" fill="#556070">del sitio</text><rect x="344" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="366" y="386" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="366" y="434" font-size="24" font-weight="600">Bloqueo en el</text><text x="366" y="464" font-size="24" font-weight="600">edge</text><text x="366" y="526" font-size="19" fill="#556070">User Agent Blocker</text><rect x="616" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="638" y="386" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="638" y="434" font-size="24" font-weight="600">Activación</text><text x="638" y="526" font-size="19" fill="#556070">Un proyecto a la vez</text><rect x="888" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="910" y="386" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="910" y="434" font-size="24" font-weight="600">Respaldo</text><text x="910" y="526" font-size="19" fill="#556070">Edge Function</text></g></svg>