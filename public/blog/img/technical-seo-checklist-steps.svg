<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Technical SEO checklist for AI visibility: 10 checks for your online shop</title><desc id="d">Check robots / Check the HTTP status of key pages / Check that sitemap / Check the canonical tag / Check hreflang if you sell in several languages</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="110" font-family="Georgia,serif" font-size="46" font-weight="600" fill="#0F1B2D">Technical SEO checklist for AI visibility: 10 checks</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="200" width="184" height="330" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="246" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="294" font-size="24" font-weight="600">Check robots</text><rect x="289" y="200" width="184" height="330" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="311" y="246" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="311" y="294" font-size="24" font-weight="600">Check the</text><text x="311" y="324" font-size="24" font-weight="600">HTTP status</text><text x="311" y="354" font-size="24" font-weight="600">of key pages</text><rect x="506" y="200" width="184" height="330" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="528" y="246" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="528" y="294" font-size="24" font-weight="600">Check that</text><text x="528" y="324" font-size="24" font-weight="600">sitemap</text><rect x="723" y="200" width="184" height="330" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="745" y="246" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="745" y="294" font-size="24" font-weight="600">Check the</text><text x="745" y="324" font-size="24" font-weight="600">canonical</text><text x="745" y="354" font-size="24" font-weigh