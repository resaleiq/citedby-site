<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Technical SEO checklist for AI visibility: 10 checks for your online shop</title><desc id="d">Check robots.txt and AI crawlers / Check the HTTP status of key pages / Check that sitemap.xml exists / Check the canonical tag / Check hreflang if you sell in several languages / Check the title and H1</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="96" font-family="Georgia,serif" font-size="42" font-weight="600" fill="#0F1B2D">Technical SEO checklist for AI visibility:</text><text x="72" y="148" font-family="Georgia,serif" font-size="42" font-weight="600" fill="#0F1B2D">10 checks for your online shop</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="231" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="279" font-size="24" font-weight="600">Check robots.txt and</text><text x="94" y="309" font-size="24" font-weight="600">AI crawlers</text><rect x="435" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="231" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="457" y="279" font-size="24" font-weight="600">Check the HTTP status</text><text x="457" y="309" font-size="24" font-weight="600">of key pages</text><rect x="798" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="231" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="820" y="279" font-size="24" font-weight="600">Check that sitemap.xml</text><text x="820" y="309" font-size="24" font-weight="600">exists</text><rect x="72" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="426" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="94" y="474" font-size="24" font-weight="600">Check the canonical</text><text x="94" y="504" font-size="24" font-weight="600">tag</text><rect x="435" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="426" font-size="40" font-weight="600" fill="#1F4FD8">5</text><text x="457" y="474" font-size="24" font-weight="600">Check hreflang if you</text><text x="457" y="504" font-size="24" font-weight="600">sell in several</text><text x="457" y="534" font-size="24" font-weight="600">languages</text><rect x="798" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="426" font-size="40" font-weight="600" fill="#1F4FD8">6</text><text x="820" y="474" font-size="24" font-weight="600">Check the title and H1</text></g></svg>