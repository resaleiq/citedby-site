<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Wat zegt ChatGPT over je webshop? 20 prompts om het zelf te checken</title><desc id="d">Vier vakken rond het getal 5: je merk, je categorie, vergelijkingen en feiten, de 20 prompts</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="118" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">Wat zegt ChatGPT over je</text><text x="72" y="182" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">webshop? 20 prompts om</text><text x="72" y="246" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">het zelf te checken</text><text x="72" y="324" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">20 prompts, elk twee keer, één logboek</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="386" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="434" font-size="24" font-weight="600">Je merk</text><text x="94" y="526" font-size="19" fill="#556070">kent het jou</text><rect x="344" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="366" y="386" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="366" y="434" font-size="24" font-weight="600">Je categorie</text><text x="366" y="526" font-size="19" fill="#556070">word je genoemd</text><rect x="616" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="638" y="386" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="638" y="434" font-size="24" font-weight="600">Vergelijkingen</text><text x="638" y="526" font-size="19" fill="#556070">wie wint van jou</text><rec