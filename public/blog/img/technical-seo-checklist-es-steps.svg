<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">SEO técnico para visibilidad en IA: 10 comprobaciones para tu tienda online</title><desc id="d">Revisa los rastreadores de IA en robots / Comprueba el código de estado / Localiza el sitemap / Mira el canonical / Revisa hreflang si vendes en varios idiomas / Comprueba el título y el H1</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="96" font-family="Georgia,serif" font-size="42" font-weight="600" fill="#0F1B2D">SEO técnico para visibilidad en IA: 10</text><text x="72" y="148" font-family="Georgia,serif" font-size="42" font-weight="600" fill="#0F1B2D">comprobaciones para tu tienda online</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="231" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="279" font-size="24" font-weight="600">Revisa los</text><text x="94" y="309" font-size="24" font-weight="600">rastreadores de IA en</text><text x="94" y="339" font-size="24" font-weight="600">robots</text><rect x="435" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="231" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="457" y="279" font-size="24" font-weight="600">Comprueba el código de</text><text x="457" y="309" font-size="24" font-weight="600">estado</text><rect x="798" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="231" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="820" y="279" font-size="24" font-weight="600">Localiza el sitemap</text><rect x="72" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="426" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="94" y="474" font-size="24" font-weight="600">Mira el canonical</text><rect x="435" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="426" font-size="40" font-weight="600" fill="#1F4FD8">5</text><text x="457" y="474" font-size="24" font-weight="600">Revisa hreflang si</text><text x="457" y="504" font-size="24" font-weight="600">vendes en varios</text><text x="457" y="534" font-size="24" font-weight="600">idiomas</text><rect x="798" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="426" font-size="40" font-weight="600" fill="#1F4FD8">6</text><text x="820" y="474" font-size="24" font-weight="600">Comprueba el título y</text><text x="820" y="504" font-size="24" font-weight="600">el H1</text></g></svg>