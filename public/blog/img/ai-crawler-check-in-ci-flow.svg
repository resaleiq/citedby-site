<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d"><title id="t">How the check runs: your pipeline, citedby.eu, the results, the exit code</title><desc id="d">Four steps from top to bottom. 1 Your pipeline runs citedby-check or the Action after a deploy, against the live address. 2 citedby.eu loads robots.txt, the home page and llms.txt over plain HTTP without JavaScript, plus one product page if it finds one. 3 A result comes back for each check: crawlers in robots.txt, text in the HTML, Organization data, Product data, llms.txt. 4 The command exits 0, 1 or 3, and the Action adds a job summary and annotations.</desc><rect width="800" height="600" fill="#fff"/><text x="32" y="46" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="600" fill="#0F1B2D">The check runs from outside your pipeline</text><rect x="32" y="76" width="736" height="98" fill="#EEF2F7" stroke="#0F1B2D" stroke-width="3"/><text x="54" y="138" font-family="system-ui,Arial,sans-serif" font-size="44" font-weight="600" fill="#1F4FD8">1</text><text x="110" y="112" font-family="system-ui,Arial,sans-serif" font-size="25" font-weight="600" fill="#0F1B2D">Your pipeline</text><text x="110" y="138" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#556070">runs citedby-check or the Action after a deploy, against the</text><text x="110" y="162" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#556070">live address</text><path d="M400 176 V190" stroke="#1F4FD8" stroke-width="3"/><path d="M400 197 l-8 -9 h16 z" fill="#1F4FD8"/><rect x="32" y="198" width="736" height="98" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="54" y="260" font-family="system-ui,Arial,sans-serif" font-size="44" font-weight="600" fill="#1F4FD8">2</text><text x="110" y="234" font-family="system-ui,Arial,sans-serif" font-size="25" font-weight="600" fill="#0F1B2D">citedby.eu</text><text x="110" y="260" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#556070">loads robots.txt, the home page and llms.txt over plain HTTP,</text><text x="110" y="284" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#556070">no JavaScript, plus one product page if it finds one</text><path d="M400 298 V312" stroke="#1F4FD8" stroke-width="3"/><path d="M400 319 l-8 -9 h16 z" fill="#1F4FD8"/><rect x="32" y="320" width="736" height="98" fill="#EEF2F7" stroke="#0F1B2D" stroke-width="3"/><text x="54" y="382" font-family="system-ui,Arial,sans-serif" font-size="44" font-weight="600" fill="#1F4FD8">3</text><text x="110" y="356" font-family="system-ui,Arial,sans-serif" font-size="25" font-weight="600" fill="#0F1B2D">Results</text><text x="110" y="382" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#556070">one per check: crawlers in robots.txt, text in the HTML,</text><text x="110" y="406" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#556070">Organization data, Product data, llms.txt</text><path d="M400 420 V434" stroke="#1F4FD8" stroke-width="3"/><path d="M400 441 l-8 -9 h16 z" fill="#1F4FD8"/><rect x="32" y="442" width="736" height="98" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="54" y="504" font-family="system-ui,Arial,sans-serif" font-size="44" font-weight="600" fill="#1F4FD8">4</text><text x="110" y="478" font-family="system-ui,Arial,sans-serif" font-size="25" font-weight="600" fill="#0F1B2D">Exit code</text><text x="110" y="504" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#556070">0 clean, 1 something to fix, 3 not measured. The Action adds a</text><text x="110" y="528" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#556070">job summary and annotations</text><text x="32" y="578" font-family="system-ui,Arial,sans-serif" font-size="17" fill="#556070">Runs from outside: localhost, private networks and pages behind a login cannot be checked.</text></svg>