<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
<title id="t">Where an assistant can read your price</title><desc id="d">Three sources feed an assistant's answer: your page, your product feed and third-party sites. Each has a fix and a way to see it.</desc>
<rect width="1200" height="630" fill="#fff"/>
<g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D">
<text x="60" y="64" font-size="28" font-weight="600">Where an assistant can read your price</text>
<g stroke="#0F1B2D" stroke-width="3" fill="#EEF2F7"><rect x="60" y="110" width="320" height="400"/><rect x="440" y="110" width="320" height="400"/><rect x="820" y="110" width="320" height="400"/></g>
<g font-size="24" font-weight="600"><text x="84" y="156">1 Your page</text><text x="464" y="156">2 Your feed</text><text x="844" y="156">3 Other sites</text></g>
<g font-size="19"><text x="84" y="206" font-weight="600" fill="#1F4FD8">How to see it</text><text x="84" y="236" font-size="17" fill="#556070">View source, search the old price.</text><text x="84" y="260" font-size="17" fill="#556070">Check the Product JSON-LD price.</text>
<text x="84" y="316" font-weight="600" fill="#B3121F">Typical fix</text><text x="84" y="346" font-size="17" fill="#556070">One price in text and markup.</text><text x="84" y="370" font-size="17" fill="#556070">Clear caches, update the markup.</text>
<text x="464" y="206" font-weight="600" fill="#1F4FD8">How to see it</text><text x="464" y="236" font-size="17" fill="#556070">Open the feed file or the</text><text x="464" y="260" font-size="17" fill="#556070">Merchant Center diagnostics.</text>
<text x="464" y="316" font-weight="600" fill="#B3121F">Typical fix</text><text x="464" y="346" font-size="17" fill="#556070">Update the feed when a sale</text><text x="464" y="370" font-size="17" fill="#556070">starts or ends, then resubmit.</text>
<text x="844" y="206" font-weight="600" fill="#1F4FD8">How to see it</text><text x="844" y="236" font-size="17" fill="#556070">Search the old price with your</text><text x="844" y="260" font-size="17" fill="#556070">brand name. Note the URL ChatGPT</text><text x="844" y="284" font-size="17" fill="#556070">cites, if it cites one.</text>
<text x="844" y="340" font-weight="600" fill="#B3121F">Typical fix</text><text x="844" y="370" font-size="17" fill="#556070">Ask the site to update it, or</text><text x="844" y="394" font-size="17" fill="#556070">publish a dated current price page.</text></g>
</g>
<text x="60" y="570" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#556070">Sources: Google Merchant Center help, OpenAI product feed spec. citedby.eu/blog</text>
</svg>
