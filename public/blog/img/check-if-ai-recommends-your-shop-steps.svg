<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">How to check whether AI assistants recommend your shop</title><desc id="d">Write 5 questions a buyer would type, for your / Ask each question in ChatGPT, Perplexity and Gemini, logged / Ask each question a second time / For each answer note two things / Add it up</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="96" font-family="Georgia,serif" font-size="42" font-weight="600" fill="#0F1B2D">How to check whether AI assistants</text><text x="72" y="148" font-family="Georgia,serif" font-size="42" font-weight="600" fill="#0F1B2D">recommend your shop</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="231" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="279" font-size="24" font-weight="600">Write 5 questions a</text><text x="94" y="309" font-size="24" font-weight="600">buyer would type, for</text><text x="94" y="339" font-size="24" font-weight="600">your</text><rect x="435" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="231" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="457" y="279" font-size="24" font-weight="600">Ask each question in</text><text x="457" y="309" font-size="24" font-weight="600">ChatGPT, Perplexity</text><text x="457" y="339" font-size="24" font-weight="600">and Gemini, logged</text><rect x="798" y="185" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="231" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="820" y="279" font-size="24" font-weight="600">Ask each question a</text><text x="820" y="309" font-size="24" font-weight="600">second time</text><rect x="72" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="426" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="94" y="474" font-size="24" font-weight="600">For each answer note</text><text x="94" y="504" font-size="24" font-weight="600">two things</text><rect x="435" y="380" width="330" height="175" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="426" font-size="40" font-weight="600" fill="#1F4FD8">5</text><text x="457" y="474" font-size="24" font-weight="600">Add it up</text></g></svg>