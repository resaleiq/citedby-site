<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
<title id="t">What a visitor sees versus what a crawler without JavaScript receives</title><desc id="d">A JavaScript-built page shows a full product page to a visitor, but the HTML a crawler receives holds only an empty div and a script tag.</desc>
<rect width="1200" height="630" fill="#fff"/>
<g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D">
<text x="60" y="64" font-size="28" font-weight="600">Same page, two readers</text>
<rect x="60" y="100" width="520" height="440" fill="#EEF2F7" stroke="#0F1B2D" stroke-width="3"/>
<text x="84" y="142" font-size="22" font-weight="600">A visitor (JavaScript runs)</text>
<rect x="84" y="168" width="200" height="170" fill="#C9D0DA"/><text x="184" y="260" font-size="18" text-anchor="middle" fill="#556070">photo</text>
<text x="308" y="196" font-size="24" font-weight="600">Organic coffee, 1 kg</text><text x="308" y="232" font-size="20" fill="#556070">Roasted in Gent, ships in 2 days</text><text x="308" y="274" font-size="28" font-weight="600">€ 24,90</text>
<rect x="308" y="296" width="140" height="42" fill="#1F4FD8"/><text x="378" y="323" font-size="18" text-anchor="middle" fill="#fff">Add to cart</text>
<text x="84" y="388" font-size="18" fill="#556070">Name, price, stock and description are all readable.</text>
<rect x="620" y="100" width="520" height="440" fill="#fff" stroke="#B3121F" stroke-width="3"/>
<text x="644" y="142" font-size="22" font-weight="600" fill="#B3121F">A crawler (no JavaScript)</text>
<g font-family="ui-monospace,Menlo,monospace" font-size="19"><text x="644" y="190">&lt;body&gt;</text><text x="668" y="224">&lt;div id="root"&gt;&lt;/div&gt;</text><text x="668" y="258">&lt;script src="app.js"&gt;&lt;/script&gt;</text><text x="644" y="292">&lt;/body&gt;</text></g>
<text x="644" y="388" font-size="18" fill="#B3121F">No name, no price, no description in the HTML.</text>
</g>
<text x="60" y="590" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#556070">Illustration with invented example values. Sites that render on the server do not have this gap.</text>
</svg>
