" font-weight="600" fill="#1F4FD8">3</text><text x="638" y="434" font-size="24" font-weight="600">Free graders</text><text x="638" y="526" font-size="19" fill="#556070">One score for one</text><text x="638" y="550" font-size="19" fill="#556070">site</text><rect x="888" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="910" y="386" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="910" y="434" font-size="24" font-weight="600">Audit with</text><text x="910" y="464" font-size="24" font-weight="600">fixes</text><text x="910" y="526" font-size="19" fill="#556070">CitedBy, from €9</text></g></svg>