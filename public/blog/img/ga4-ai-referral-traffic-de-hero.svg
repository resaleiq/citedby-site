<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">GA4: So messen Sie Besucher von ChatGPT und anderen KI-Assistenten</title><desc id="d">Titelkarte: GA4 und KI-Traffic, mit drei Schritten: Quellen im Bericht finden, Kanal mit Regex anlegen, Kanal über Referral schieben</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="118" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">GA4: So messen Sie</text><text x="72" y="182" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">Besucher von ChatGPT und</text><text x="72" y="246" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">anderen KI-Assistenten</text><text x="72" y="324" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">Eigener Kanal, richtige Reihenfolge, ehrliche Zahl</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="386" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="434" font-size="24" font-weight="600">Quellen finden</text><text x="94" y="526" font-size="19" fill="#556070">im Akquisitionsbericht</text><rect x="435" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="457" y="386" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="457" y="434" font-size="24" font-weight="600">Kanal anlegen</text><text x="457" y="526" font-size="19" fill="#556070">Quelle per Regex</text><rect x="798" y="340" width="330" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="820" y="386" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="820" y="434" font-size="24" font-weight="600">Reihenfolge</text><text x="820"