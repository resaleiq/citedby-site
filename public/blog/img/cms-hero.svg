<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">AI visibility checklist for Shopify, WooCommerce and more</title><desc id="d">Four checks to run on any shop platform: robots.txt, sitemap, product data in JSON-LD, and text that needs JavaScript</desc><rect width="1200" height="630" fill="#EEF2F7"/><rect width="1200" height="12" fill="#0F1B2D"/><text x="72" y="118" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">AI visibility checklist</text><text x="72" y="182" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">for Shopify, WooCommerce</text><text x="72" y="246" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="600" fill="#0F1B2D">and more</text><text x="72" y="324" font-family="system-ui,Arial,sans-serif" font-size="26" fill="#556070">Where each setting lives on your platform</text><g font-family="system-ui,Arial,sans-serif" fill="#0F1B2D"><rect x="72" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="94" y="386" font-size="40" font-weight="600" fill="#1F4FD8">1</text><text x="94" y="434" font-size="24" font-weight="600">Find robots.txt</text><text x="94" y="526" font-size="19" fill="#556070">Open it in a browser</text><rect x="344" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="366" y="386" font-size="40" font-weight="600" fill="#1F4FD8">2</text><text x="366" y="434" font-size="24" font-weight="600">Find the</text><text x="366" y="464" font-size="24" font-weight="600">sitemap</text><text x="366" y="526" font-size="19" fill="#556070">List of products and</text><text x="366" y="550" font-size="19" fill="#556070">pages</text><rect x="616" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="638" y="386" font-size="40" font-weight="600" fill="#1F4FD8">3</text><text x="638" y="434" font-size="24" font-weight="600">Check product</text><text x="638" y="464" font-size="24" font-weight="600">data</text><text x="638" y="526" font-size="19" fill="#556070">JSON-LD in the source</text><rect x="888" y="340" width="239" height="230" fill="#fff" stroke="#0F1B2D" stroke-width="3"/><text x="910" y="386" font-size="40" font-weight="600" fill="#1F4FD8">4</text><text x="910" y="434" font-size="24" font-weight="600">Check theme</text><text x="910" y="464" font-size="24" font-weight="600">text</text><text x="910" y="526" font-size="19" fill="#556070">Is it in the raw HTML</text></g></svg>